[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qi-guard"
version = "0.1.0"
description = "Official Python SDK for QI-Guard Quantum Smart Contract Security on Stellar/Soroban"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "QuantumInfra", email = "engineering@quantuminfra.io"}
]
keywords = ["stellar", "soroban", "security", "quantum", "pennylane", "pqc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0"
]
